name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/trendyprompt run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Copy built files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "artifacts/trendyprompt/dist/*,artifacts/api-server/dist/*"
          target: "/var/www/trendyprompt"

      - name: Restart API & reload nginx on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Copy frontend dist to nginx web root
            cp -r /var/www/trendyprompt/artifacts/trendyprompt/dist/. /var/www/html/

            # Restart the API with pm2 (or start it if not running)
            cd /var/www/trendyprompt
            pm2 restart trendyprompt-api 2>/dev/null || \
              pm2 start /var/www/trendyprompt/artifacts/api-server/dist/index.mjs \
                --name trendyprompt-api \
                --env production

            pm2 save
            echo "Deploy complete!"
